# Dev-only host port mappings, e.g. so host-run `pnpm dev:api`/`dev:worker`
# and `drizzle-kit migrate`/`studio` can reach the containers. Not auto-loaded
# by `docker compose up` — only applied via `pnpm services:up:dev`.
#
# `internal` (see docker-compose.yml) has `internal: true`, which stops Docker
# from setting up the NAT/DNAT rules that back published ports — `ports:` on a
# purely-internal-network container is silently a no-op. `dev_host_access` is a
# second, ordinary (non-internal) network attached to postgres/redis/pgadmin
# only in this dev overlay, purely so their published ports actually bind on the host.
# It isn't added to api/worker/caddy, so the isolation `internal: true`
# provides for the plain/staging stacks is unaffected there.
services:
  postgres:
    networks: [internal, dev_host_access]
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
  redis:
    networks: [internal, dev_host_access]
    ports:
      - '127.0.0.1:6379:6379'
  # Dev-only DB GUI at http://localhost:5050 (desktop mode, no login).
  # Server is pre-registered via servers.json; enter the POSTGRES_PASSWORD
  # once on first connect and tick "Save password" (persists in pgadmin_data).
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_DISABLE_POSTFIX: 'true'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - '127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80'
    networks: [internal, dev_host_access]
    depends_on:
      postgres: { condition: service_healthy }
    # YAML anchors don't cross compose files, so inline instead of *default-logging
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  pgadmin_data:

networks:
  dev_host_access:
