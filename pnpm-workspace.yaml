packages:
  - "apps/*"
  - "packages/*"

# The Expo decision — see step 3 for what you're trading away.
nodeLinker: hoisted

# Single source of truth for versions shared across packages.
catalog:
  typescript: ^5.9.3
  zod: ^4.0.0
  vitest: ^3.2.7
  "@types/node": ^24.13.3

# Build scripts are blocked unless allowed here. In v11 an unapproved
# build is an ERROR, not a warning — installs fail outright.
allowBuilds:
  esbuild: true
  "@swc/core": true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - bullmq@6.0.10
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/prebuild-config@57.0.11'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-server@57.0.2
  - expo@57.0.12
